<!DOCTYPE html>
<html lang="en">
    <head>
        <title>motes about advanced html</title>
        <meta charset="UTF-8"/>
        <!--embeded style sheets go insode the head tag-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

        <style>
            body{
                background-color:rgb(38, 165, 112);
                font-family: "Creepster", system-ui;
                font-weight: 400;
                font-style: normal;
            }
            img{
                width: 250px;
            }
            #unordered{
                font-family: papyrus;
            }
            #ordered{
                color: teal;
                background-color: blueviolet;
            }
            .odd{
                background-color:blueviolet;
                color:crimson;
            }
            p{
                background-color:cadetblue;
                color: #46bbc5;
                background-color:rgba(0, 0, 0, 0);
                text-align: right;
            }
            h1{
                text-align: center;
                font-size: 50px;
                border: 3px solid white;
            }
            .bold{
                font-weight: bolder;
                color:black;
            }
            #italics{
                font-style: italic;
            }
            .box{
                background-color: green; height: 100px; width: 100px;
                border: 3px solid green;
                font-variant: small-caps;
                margin: 20px;
                padding: 20px;
            }
            
            #box-wrapper{
                display: block;
                margin:auto;
                width:50%;
            }
            #lists-wrapper{
                display: grid;
                grid-template-columns: 50% 50%;
            }
            #imgs-wrapper{
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
            }
        </style>
        <!--box wrapper is how to move the box-->
    </head>
    <body>
        <h1>html <span id="italics">advanced</span> notes</h1>
        <!--this has inline CSS. . . that is bad syntax!-->
        <div id="box-wrapper">
        <div class="box">
            <p>this is in the div</p>
        </div>
    </div>
    <div id="lists-wrapper">
        <div id="ordered">
        <p>this is how to make an orderd (numbered) list</p>
        <ol>
            <li class="odd">computer program 1</li>
            <li>computer porgram 2</li>
            <li class="odd">advanced computer program</li>
        </ol>
        </div>
        <div id="unordered">
        <p> this is how you make an <span class="bold">unorderd (bulleted)</span> list</p>
        <ul style="list-style-type: circle;">
            <li class="odd">apple</li>
            <li>orange</li>
            <li class="odd">banana</li>
            <li>peach</li>
        </ul>
        <a href="https://docs.google.com/document/d/1AbM2AtUDGilx8k3y8cJZtbDMEr9HRitBnKeIAdMrszM/edit?tab=t.0" target="_blank">W3Schools Unordered List Page</a>
