    <head>
        <title>Javascript noteds</title>
        <meta charset="UTF-8">
        <style>
            #timp{
                display:none;
                width: 50%;
            }
        </style>
        <script>
            let count = 0
            let imgs = 
            function update(){
                document.getElementById('title').style.color = document.getElementById("color-choice").value
            }
            function add(){
                count += 1
                document.getElementById("number").innerHTML = count
            }
            function hover(id){
                document.getElementById(id).style.backgroundColor = "red"
                document.getElementById(id).style.color = "white"
            }
            function unhover(id){
                document.getElementById(id).style.backgroundColor = "lightgrey"
                document.getElementById(id).style.color = "black"
            }
            function show(){
                document.getElementById("timp").style.display ="block"
            }
            function show(){
                if(document.getElementById("timp").style.display == "block"){
                    document.getElementById("timp").style.display = "none"
                }else{
                 document.getElementById("timp").style.display = "block"
                }
            }
            //onclick onmouseover onmouseout onmousedown onmouseup
        </script>
    </head>
    <body>
        <h1 id="title" onmouseover="alert('This is about JavaScript!')">final</h1>
        <input type="color" id="color-choice">
        <button onclick="update()" id="one" onmouseover="hover('one')"
        onmouseout="unhover('one')">Click Me!</button>
        <p id="number" onmouseover="show()">0</p>
        <button onclick="add()" id="two" onmouseover="hover('two')"
        onmouseout="unhover('two')">Add</button>
